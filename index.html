<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Research Opportunity Portal</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{
            background-color: #000000;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card{
            background-color: #161616;
            color: #e0e0e0;
            border: 1px solid #282828;
        }
        .card-header-red{
            background-color: #dc3545 !important;
            color: #ffffff;
        }
        .card-header-green{
            background-color: #198754 !important;
            color: #ffffff;
        }
        .form-control, .form-control:focus{
            background-color: #222222;
            color: #ffffff;
            border-color: #3b3b3b;
        }
        .form-control::placeholder{
            color: #888;
        }
        .table{
            color: #e0e0e0;
        }
        .table-striped > tbody > tr:nth-of-type(odd){
            background-color: #1c1c1c;
            color: #e0e0e0;
        }
        .table-striped > tbody > tr:nth-of-type(even){
            background-color: #161616;
            color: #e0e0e0;
        }
        h1{
            color: #ffffff;
            font-weight: 700;
        }
    </style>
</head>
<body class="bg-black">

    <div class="container my-5">
        <h1 class="text-center mb-4">University Research Opportunity Portal</h1>

        <div class="card shadow mb-5">
            <div class="card-header card-header-red">
                <h5 class="mb-0">Available Research Opportunities</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped align-middle">
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Faculty</th>
                                <th>Department</th>
                                <th>Area</th>
                                <th>Positions</th>
                                <th>Deadline</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="opportunitiesTableBody">
                           
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="card shadow">
            <div class="card-header card-header-green">
                <h5 class="mb-0">Post New Research Opportunity</h5>
            </div>
            <div class="card-body">
                <form id="opportunityForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Title</label>
                            <input type="text" class="form-control" id="title" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Research Area</label>
                            <input type="text" class="form-control" id="research_area" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Faculty Name</label>
                            <input type="text" class="form-control" id="faculty_name" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Department</label>
                            <input type="text" class="form-control" id="department" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="description" rows="2" required></textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Required Skills</label>
                            <input type="text" class="form-control" id="required_skills" placeholder="e.g., Python, SQL, Git" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Available Positions</label>
                            <input type="number" class="form-control" id="available_positions" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Application Deadline</label>
                            <input type="date" class="form-control" id="application_deadline" required>
                        </div>
                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-success">Publish Opportunity</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <script>
        const API_URL = 'http://localhost:5000/api/opportunities';
        async function loadOpportunities() {
            try {
                const response = await fetch(API_URL);
                const opportunities = await response.json();
                const tbody = document.getElementById('opportunitiesTableBody');
                tbody.innerHTML = '';

                if (opportunities.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">No research opportunities found.</td></tr>';
                    return;
                }

                opportunities.forEach(opp => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td><strong>${opp.title}</strong><br><small class="text-muted">${opp.description}</small></td>
                        <td>${opp.faculty_name}</td>
                        <td>${opp.department}</td>
                        <td><span class="badge bg-secondary">${opp.research_area}</span></td>
                        <td>${opp.available_positions}</td>
                        <td>${opp.application_deadline.split('T')[0]}</td>
                        <td><button class="btn btn-danger btn-sm" onclick="deleteOpportunity(${opp.id})">Delete</button></td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (err) {
                console.error('Error loading opportunities:', err);
            }
        }
        document.getElementById('opportunityForm').addEventListener('submit', async (e) =>{
            e.preventDefault();
            const newOpp ={
                title: document.getElementById('title').value,
                research_area: document.getElementById('research_area').value,
                faculty_name: document.getElementById('faculty_name').value,
                department: document.getElementById('department').value,
                description: document.getElementById('description').value,
                required_skills: document.getElementById('required_skills').value,
                available_positions: parseInt(document.getElementById('available_positions').value),
                application_deadline: document.getElementById('application_deadline').value,
                status: 'Open'
            };
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newOpp)
                });
                if (response.ok) {
                    document.getElementById('opportunityForm').reset();
                    loadOpportunities();
                } else {
                    alert('Failed to create opportunity');
                }
            } catch (err) {
                console.error('Error submitting form:', err);
            }
        });
        async function deleteOpportunity(id) {
            if (!confirm('Are you sure you want to delete this opportunity?')) return;
            try {
                const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    loadOpportunities();
                } else {
                    alert('Failed to delete');
                }
            } catch (err) {
                console.error('Error deleting:', err);
            }
        }

        loadOpportunities();
    </script>
</body>
</html>
